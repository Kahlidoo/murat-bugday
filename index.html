<!doctype html>
<html lang="en" data-brand="sa">
<head>
<meta charset="utf-8">

<script>
  // Brand comes from the QR code that was scanned: ?c=sa (green) or ?c=ltd (red).
  // Set before first paint so there is no colour flash.
  (function () {
    var c = new URLSearchParams(location.search).get("c");
    window.BRAND = c === "ltd" ? "ltd" : "sa";
    document.documentElement.dataset.brand = window.BRAND;
  })();
</script>
<link id="icon" rel="icon" href="assets/favicon-sa.png">
<link id="touch-icon" rel="apple-touch-icon" href="assets/apple-touch-sa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #FFFFFF;
    --outside: #F1F1F2;
    --text: #222327;
    --text-2: #8A8C95;
    --icon: #B3B4BB;
    --line: #ECECEE;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --fab-shadow: 0 10px 14px 1px rgba(0, 0, 0, .14), 0 4px 20px 0 rgba(0, 0, 0, .10);
  }
  html[data-brand="sa"]  { --brand: #23925D; --header: #18774A; --brand-rgb: 35, 146, 93; }
  html[data-brand="ltd"] { --brand: #EE1C25; --header: #C9151D; --brand-rgb: 238, 28, 37; }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--outside); }
  html.locked { overflow: hidden; }
  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; fill: currentColor; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .page {
    position: relative;
    max-width: 440px;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--page);
  }

  /* ---------- opening screen ---------- */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: #fff;
    transition: background-color 520ms ease;
  }
  .intro.leaving { background-color: rgba(255, 255, 255, 0); pointer-events: none; }
  .intro-mark { position: relative; width: 160px; height: 160px; }
  .intro-logo {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 999px;
    animation: intro-in 2300ms var(--ease-in-out) both;
    will-change: transform;
  }
  @keyframes intro-in {
    0%   { opacity: 0; transform: scale(0.8); filter: blur(8px); }
    18%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* soft brand-coloured rings breathing out from behind the logo */
  .intro-ring {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(var(--brand-rgb), .16);
    opacity: 0;
    animation: ring 1700ms var(--ease-out) infinite;
    animation-delay: 450ms;
  }
  .intro-ring + .intro-ring { animation-delay: 1300ms; }
  @keyframes ring {
    0%   { opacity: 0;   transform: scale(0.9); }
    15%  { opacity: 1; }
    100% { opacity: 0;   transform: scale(1.75); }
  }
  .intro.leaving .intro-ring { animation: none; opacity: 0; }
  /* thin loading bar along the top, as on the original */
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    overflow: hidden;
    background: #F2F2F3;
    transition: opacity 300ms ease;
  }
  .intro.leaving .bar { opacity: 0; }
  .bar::before, .bar::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    background: var(--brand);
  }
  .bar::before { animation: bar-long 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite; }
  .bar::after  { animation: bar-short 2.1s cubic-bezier(0.165, 0.84, 0.44, 1) 1.15s infinite; }
  @keyframes bar-long  { 0% { left: -35%; right: 100%; } 60%, 100% { left: 100%; right: -90%; } }
  @keyframes bar-short { 0% { left: -200%; right: 100%; } 60%, 100% { left: 107%; right: -8%; } }

  /* ---------- header ---------- */
  .header {
    position: relative;
    background: var(--header);
    color: #fff;
    text-align: center;
    padding-top: max(40px, calc(env(safe-area-inset-top) + 28px));
  }
  .avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto;
    padding: 6px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .35);
  }
  .avatar img { width: 100%; height: 100%; display: block; border-radius: 999px; opacity: 0; }
  .avatar.ready img { opacity: 1; }
  h1 {
    margin: 18px 0 0;
    padding: 0 24px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .sub {
    margin: 6px 0 0;
    font-size: 13.5px;
    color: rgba(255, 255, 255, .78);
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 26px;
    border-top: 1px solid rgba(255, 255, 255, .14);
  }
  .action {
    position: relative;
    overflow: hidden;
    height: 66px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .action + .action { border-left: 1px solid rgba(255, 255, 255, .14); }

  /* ---------- details ---------- */
  .details { padding: 12px 0 168px; }
  .row {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    min-height: 77px;
    padding: 0 20px;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    top: 0; left: 65px; right: 0;
    height: 1px;
    background: var(--line);
  }
  .row svg { width: 22px; height: 22px; color: var(--icon); margin-right: 23px; }
  .row .meta { min-width: 0; }
  .row b {
    display: block;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .row small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--text-2); }

  /* ---------- floating buttons ---------- */
  .fabs {
    position: fixed;
    z-index: 20;
    right: max(18px, calc((100vw - 440px) / 2 + 18px));
    bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .fab {
    position: relative;
    overflow: hidden;
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    box-shadow: var(--fab-shadow);
    transition: transform 160ms var(--ease-out), box-shadow 200ms ease;
  }
  .fab:active { transform: scale(0.94); }
  .fab.share { background: #fff; color: rgba(0, 0, 0, .58); }
  .fab.add { background: var(--brand); color: #fff; }
  .fab svg { width: 24px; height: 24px; }
  /* person-plus ⇄ check after tapping save */
  .fab.add .swap { position: relative; width: 24px; height: 24px; }
  .fab.add .swap svg { position: absolute; inset: 0; transition: opacity 180ms ease, transform 300ms var(--ease-out); }
  .fab.add .swap svg + svg { opacity: 0; transform: scale(0.4) rotate(-45deg); }
  .fab.add.done .swap svg:first-child { opacity: 0; transform: scale(0.4) rotate(45deg); }
  .fab.add.done .swap svg + svg { opacity: 1; transform: none; }

  /* ---------- touch ripple (material) ---------- */
  .ripple {
    position: absolute;
    border-radius: 999px;
    pointer-events: none;
    transform: scale(0);
    opacity: 1;
    animation: ripple 620ms var(--ease-out) forwards;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }

  @media (hover: hover) and (pointer: fine) {
    .action:hover { background: rgba(255, 255, 255, .06); }
    a.row:hover { background: #FAFAFB; }
    .fab:hover { box-shadow: 0 14px 22px 1px rgba(0, 0, 0, .16), 0 6px 26px 0 rgba(0, 0, 0, .12); }
  }

  /* ---------- snackbar ---------- */
  .toast {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
    padding: 12px 16px;
    border-radius: 10px;
    background: #2A2B2F;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap; /* left:50% halves the shrink-to-fit width; keep the message on one line */
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .35);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 10px) scale(0.96);
    transition: opacity 200ms ease, transform 340ms var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* Android: Chrome's own download bar takes the bottom of the screen, so speak from the top */
  .toast.top { top: max(16px, env(safe-area-inset-top)); bottom: auto; transform: translate(-50%, -10px) scale(0.96); }
  .toast.top.show { transform: translate(-50%, 0) scale(1); }

  /* ---------- reveal after the opening ---------- */
  .pre { opacity: 0; }
  .revealed .pre { animation: rise 620ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 55ms); }
  .revealed .fab.pre { animation: pop 520ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 200ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .intro-logo { animation: fade 300ms ease both; }
    .intro-ring { display: none; }
    .revealed .pre, .revealed .fab.pre { animation: fade 200ms ease both; }
    .ripple { display: none; }
  }

  @media (min-width: 640px) {
    .page { box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 30px 80px -30px rgba(0, 0, 0, .25); }
  }
</style>
<noscript><style>.intro { display: none; } .pre, .avatar img { opacity: 1; }</style></noscript>
</head>

<script>
  (function () {
    var key = window.BRAND;
    var company = key === "ltd" ? "Yüksel Limited" : "Yüksel Saudia";
    var root = document.documentElement;

    document.querySelectorAll("[data-company]").forEach(function (el) { el.textContent = company; });
    document.getElementById("icon").href = "assets/favicon-" + key + ".png";
    document.getElementById("touch-icon").href = "assets/apple-touch-" + key + ".png";
    document.title = "Murat Bugday · " + company;

    /* ---------- opening: logo grows, then flies into the header avatar ---------- */
    var intro = document.getElementById("intro");
    var introLogo = document.getElementById("intro-logo");
    var avatar = document.getElementById("avatar");
    var avatarImg = document.getElementById("logo");
    var theme = document.getElementById("theme");
    var headerColor = getComputedStyle(root).getPropertyValue("--header").trim();
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // The opening plays on every scan, open and refresh. Only coming back with the
    // Back button (e.g. returning from Contacts) skips it.
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var seen = !!nav && nav.type === "back_forward";

    function reveal() {
      avatar.classList.add("ready");
      if (intro.parentNode) intro.parentNode.removeChild(intro);
      root.classList.remove("locked");
      theme.setAttribute("content", headerColor);
      document.body.classList.add("revealed");
    }

    function flyIntoAvatar() {
      var from = introLogo.getBoundingClientRect();
      var to = avatarImg.getBoundingClientRect();
      var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
      var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
      var s = to.width / from.width;
      intro.classList.add("leaving");
      theme.setAttribute("content", headerColor);
      if (!introLogo.animate) { reveal(); return; }
      introLogo.style.animation = "none";
      introLogo.animate(
        [{ transform: "none" }, { transform: "translate(" + dx + "px," + dy + "px) scale(" + s + ")" }],
        { duration: 760, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "forwards" }
      ).onfinish = reveal;
    }

    if (seen) {
      reveal();
    } else {
      root.classList.add("locked");
      window.scrollTo(0, 0);
      var start = performance.now();
      var go = function () {
        // let the logo finish growing (2.3s) even when the page loads instantly
        var wait = Math.max(0, (reduce ? 900 : 2350) - (performance.now() - start));
        setTimeout(reduce ? reveal : flyIntoAvatar, wait);
      };
      if (document.readyState === "complete") go(); else window.addEventListener("load", go);
      setTimeout(function () { if (intro.parentNode) reveal(); }, 6000); // never get stuck behind the opening
    }

    /* ---------- material ripple on tap ---------- */
    document.addEventListener("pointerdown", function (e) {
      var host = e.target.closest("[data-ripple]");
      if (!host || reduce) return;
      var r = host.getBoundingClientRect();
      var size = Math.hypot(Math.max(e.clientX - r.left, r.right - e.clientX), Math.max(e.clientY - r.top, r.bottom - e.clientY)) * 2;
      var dot = document.createElement("span");
      dot.className = "ripple";
      dot.style.width = dot.style.height = size + "px";
      dot.style.left = (e.clientX - r.left - size / 2) + "px";
      dot.style.top = (e.clientY - r.top - size / 2) + "px";
      dot.style.background = host.dataset.ripple === "light" ? "rgba(255,255,255,.32)" : "rgba(0,0,0,.07)";
      host.appendChild(dot);
      setTimeout(function () { dot.remove(); }, 650);
    });

    /* ---------- snackbar ---------- */
    var toast = document.getElementById("toast");
    var toastTimer;
    function notify(msg, ms, top) {
      toast.textContent = msg;
      toast.classList.toggle("top", !!top);
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 1800);
    }

    /* ---------- save contact ---------- */
    // iPhone opens a .vcf straight into Contacts. Android browsers are not allowed to:
    // they always download it first, so give the file a clean name and point at "Open".
    var isAndroid = /Android/i.test(navigator.userAgent);
    var save = document.getElementById("save");
    save.href = "murat-bugday-" + key + ".vcf";
    if (isAndroid) save.setAttribute("download", "Murat Bugday.vcf");
    var saveTimer;
    save.addEventListener("click", function () {
      save.classList.add("done");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { save.classList.remove("done"); }, isAndroid ? 4000 : 2200);
      if (isAndroid) setTimeout(function () { notify("Now tap “Open” at the bottom", 6000, true); }, 350);
    });

    /* ---------- share ---------- */
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        var t = document.createElement("textarea");
        t.value = text;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
        document.body.removeChild(t);
      });
    }
    document.getElementById("share").addEventListener("click", function () {
      var data = { title: "Murat Bugday", text: "Murat Bugday · " + company, url: location.href };
      if (navigator.share) {
        navigator.share(data).catch(function () {});
      } else {
        copyText(location.href).then(function () { notify("Link copied"); }, function () { notify("Couldn’t copy link"); });
      }
    });
  })();
</script>
</body>
</html>
