<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murat Bugday · Yüksel</title>
<meta name="description" content="Murat Bugday — Yüksel Saudia. Call, email or save contact.">
<meta property="og:title" content="Murat Bugday">
<meta property="og:description" content="Yüksel Saudia · Yüksel Limited — tap to save contact">
<meta property="og:image" content="https://kahlidoo.github.io/murat-bugday/assets/og.png">
<meta property="og:type" content="profile">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0B" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<script>
  // Brand comes from the QR code that was scanned: ?c=sa (green) or ?c=ltd (red).
  // Set before first paint so there is no colour flash.
  (function () {
    var c = new URLSearchParams(location.search).get("c");
    document.documentElement.dataset.brand = c === "ltd" ? "ltd" : "sa";
  })();
</script>
<link id="icon" rel="icon" href="assets/favicon-sa.png">
<link id="touch-icon" rel="apple-touch-icon" href="assets/apple-touch-sa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F2;
    --surface: #FFFFFF;
    --surface-2: #FAFAF8;
    --line: rgba(20, 20, 19, 0.08);
    --line-strong: rgba(20, 20, 19, 0.12);
    --text: #141413;
    --text-2: #5F5D58;
    --text-3: #8C8983;
    --shadow: 0 1px 1px rgba(20,20,19,.03), 0 2px 4px rgba(20,20,19,.03), 0 12px 32px -8px rgba(20,20,19,.08);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius: 18px;
  }
  html[data-brand="sa"]  { --brand: #23925D; --brand-strong: #1A7A4C; --brand-rgb: 35, 146, 93; }
  html[data-brand="ltd"] { --brand: #EE1C25; --brand-strong: #CF1820; --brand-rgb: 238, 28, 37; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C0C0B;
      --surface: #161615;
      --surface-2: #1C1C1A;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.11);
      --text: #F3F2EF;
      --text-2: #A8A6A0;
      --text-3: #75736E;
      --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -8px rgba(0,0,0,.6);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "ss01", "cv11";
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 10px; }

  .page {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- cover ---------- */
  .cover {
    position: relative;
    height: 176px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(var(--brand-rgb), .16), rgba(var(--brand-rgb), .05) 70%),
      var(--surface-2);
  }
  /* faint drafting grid — a nod to construction drawings */
  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(var(--brand-rgb), .14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--brand-rgb), .14) 1px, transparent 1px),
      linear-gradient(rgba(var(--brand-rgb), .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--brand-rgb), .07) 1px, transparent 1px);
    background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
    background-position: -1px -1px;
    -webkit-mask-image: radial-gradient(90% 100% at 50% 0%, #000 30%, transparent 85%);
            mask-image: radial-gradient(90% 100% at 50% 0%, #000 30%, transparent 85%);
  }
  .cover::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 1px;
    background: var(--line);
  }

  .share {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 2;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
            backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,.04);
    color: var(--text-2);
    transition: transform 160ms var(--ease-out), color 160ms ease;
  }
  .share:active { transform: scale(0.94); }

  /* ---------- identity ---------- */
  .identity {
    position: relative;
    padding: 0 24px;
    margin-top: -52px;
  }
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 999px;
    background: var(--surface);
    padding: 5px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 24px -6px rgba(var(--brand-rgb), .35), 0 2px 6px rgba(0,0,0,.06);
  }
  /* the logo's letters are transparent cut-outs, so it always sits on white */
  .avatar img { width: 100%; height: 100%; display: block; border-radius: 999px; background: #fff; }

  h1 {
    margin: 20px 0 0;
    font-size: 30px;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.028em;
  }
  .company {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-2);
    font-size: 15px;
    letter-spacing: -0.005em;
  }
  .company i {
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--brand);
    transform: rotate(45deg);
  }

  /* ---------- quick actions ---------- */
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 24px 24px 0;
  }
  .action {
    height: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20,20,19,.04);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    transition: transform 160ms var(--ease-out), box-shadow 200ms ease;
  }
  .action svg { color: var(--brand); }
  .action:active { transform: scale(0.97); }

  /* ---------- details ---------- */
  .label {
    padding: 28px 24px 10px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .list {
    margin: 0 24px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow), 0 0 0 1px var(--line);
    overflow: hidden;
  }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 10px 8px 10px 16px;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 62px;
    right: 0;
    height: 1px;
    background: var(--line);
  }
  .row-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    border-radius: 10px;
  }
  .glyph {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(var(--brand-rgb), .09);
    color: var(--brand);
  }
  .meta { min-width: 0; }
  .meta small {
    display: block;
    font-size: 12.5px;
    color: var(--text-3);
    line-height: 1.3;
  }
  .meta span {
    display: block;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .copy {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: var(--text-3);
    transition: transform 160ms var(--ease-out), color 160ms ease, background-color 160ms ease;
  }
  .copy:active { transform: scale(0.9); }
  .copy .ok { display: none; color: var(--brand); }
  .copy.done .ok { display: block; animation: pop 320ms var(--ease-out); }
  .copy.done .idle { display: none; }

  @media (hover: hover) and (pointer: fine) {
    .share:hover { color: var(--text); }
    .action:hover { box-shadow: 0 0 0 1px var(--line-strong), 0 4px 12px -4px rgba(20,20,19,.10); }
    .copy:hover { color: var(--text); background: var(--surface-2); }
    .row-main:hover span { color: var(--brand-strong); }
  }

  .spacer { height: 16px; }

  /* ---------- save bar ---------- */
  .dock {
    position: sticky;
    bottom: 0;
    margin-top: auto;
    padding: 20px 24px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 36%);
    z-index: 5;
  }
  .save {
    position: relative;
    width: 100%;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 16px;
    background: var(--brand-strong);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      0 0 0 1px rgba(var(--brand-rgb), .9),
      0 8px 20px -6px rgba(var(--brand-rgb), .55);
    transition: transform 160ms var(--ease-out), filter 160ms ease;
  }
  .save:active { transform: scale(0.98); }
  @media (hover: hover) and (pointer: fine) { .save:hover { filter: brightness(1.06); } }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(max(20px, env(safe-area-inset-bottom)) + 70px);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 10px 12px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 24px -6px rgba(0,0,0,.25);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 8px) scale(0.96);
    transition: opacity 200ms ease, transform 320ms var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ---------- entrance ---------- */
  .in {
    animation: rise 640ms var(--ease-out) both;
    animation-delay: calc(var(--i, 0) * 55ms + 60ms);
  }
  .avatar.in { animation-name: avatar; }
  .cover.in { animation: fade 800ms ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes avatar {
    from { opacity: 0; transform: scale(0.88); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .in, .cover.in { animation: fade 200ms ease both; }
    .toast { transition: opacity 150ms ease; transform: translate(-50%, 0); }
  }

  /* ---------- larger screens: present as a card ---------- */
  @media (min-width: 640px) {
    body { display: grid; place-items: center; padding: 48px 16px; }
    .page {
      min-height: auto;
      border-radius: 28px;
      overflow: clip;
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line), 0 30px 80px -24px rgba(20,20,19,.22);
    }
    .dock { position: static; padding-bottom: 24px; }
  }
</style>
</head>

<script>
  (function () {
    var BRANDS = {
      sa:  { company: "Yüksel Saudia",  theme: "#1A7A4C" },
      ltd: { company: "Yüksel Limited", theme: "#CF1820" }
    };
    var key = document.documentElement.dataset.brand;
    var b = BRANDS[key];

    document.querySelectorAll("[data-company]").forEach(function (el) { el.textContent = b.company; });
    var logo = document.getElementById("logo");
    logo.src = "assets/logo-" + key + ".png";
    logo.alt = b.company + " logo";
    document.getElementById("icon").href = "assets/favicon-" + key + ".png";
    document.getElementById("touch-icon").href = "assets/apple-touch-" + key + ".png";
    document.getElementById("save").href = "murat-bugday-" + key + ".vcf";
    document.title = "Murat Bugday · " + b.company;

    var toast = document.getElementById("toast");
    var toastText = document.getElementById("toast-text");
    var toastTimer;
    function notify(msg) {
      toastText.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        var t = document.createElement("textarea");
        t.value = text;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
        document.body.removeChild(t);
      });
    }

    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      var timer;
      btn.addEventListener("click", function () {
        copyText(btn.dataset.copy).then(function () {
          btn.classList.add("done");
          notify(btn.dataset.what + " copied");
          clearTimeout(timer);
          timer = setTimeout(function () { btn.classList.remove("done"); }, 1600);
        }, function () { notify("Couldn’t copy"); });
      });
    });

    document.getElementById("share").addEventListener("click", function () {
      var data = { title: "Murat Bugday", text: "Murat Bugday · " + b.company, url: location.href };
      if (navigator.share) {
        navigator.share(data).catch(function () {});
      } else {
        copyText(location.href).then(function () { notify("Link copied"); });
      }
    });
  })();
</script>
</body>
</html>
