<!doctype html>
<html lang="en" data-brand="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murat Bugday · Yüksel</title>
<meta name="description" content="Murat Bugday — Yüksel Saudia. Call, email or save contact.">
<meta property="og:title" content="Murat Bugday">
<meta property="og:description" content="Yüksel Saudia · Yüksel Limited — tap to save contact">
<meta property="og:image" content="https://muratbugday.yukselsaudia.com.sa/assets/og.png">
<meta property="og:type" content="profile">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<script>
  // Brand comes from the QR code that was scanned: ?c=sa (green) or ?c=ltd (red).
  // Set before first paint so there is no colour flash.
  (function () {
    var c = new URLSearchParams(location.search).get("c");
    document.documentElement.dataset.brand = c === "ltd" ? "ltd" : "sa";
  })();
</script>
<link id="icon" rel="icon" href="assets/favicon-sa.png">
<link id="touch-icon" rel="apple-touch-icon" href="assets/apple-touch-sa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --press: #F2F1EE;
    --line: rgba(17, 17, 16, 0.07);
    --line-strong: rgba(17, 17, 16, 0.11);
    --text: #111110;
    --text-2: #63615C;
    --text-3: #9A978F;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  html[data-brand="sa"]  { --brand: #23925D; --brand-strong: #19784A; --brand-rgb: 35, 146, 93; }
  html[data-brand="ltd"] { --brand: #EE1C25; --brand-strong: #CC161E; --brand-rgb: 238, 28, 37; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0A;
      --surface: #161615;
      --press: #1F1F1D;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.12);
      --text: #F4F3F0;
      --text-2: #A3A19B;
      --text-3: #6E6C67;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 12px; }

  .page {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: max(56px, calc(env(safe-area-inset-top) + 36px)) 20px max(32px, env(safe-area-inset-bottom));
  }

  /* ---------- identity ---------- */
  .identity { text-align: center; }
  .logo {
    width: 88px;
    height: 88px;
    margin: 0 auto;
    border-radius: 999px;
    background: #fff; /* logo letters are transparent cut-outs */
    box-shadow:
      0 0 0 1px var(--line),
      0 1px 2px rgba(17, 17, 16, .06),
      0 14px 30px -12px rgba(var(--brand-rgb), .55);
  }
  .logo img { width: 100%; height: 100%; display: block; border-radius: 999px; }

  h1 {
    margin: 24px 0 0;
    font-size: 32px;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.032em;
    text-wrap: balance;
  }
  .company {
    margin: 10px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: var(--text-2);
  }
  .company i {
    width: 6px;
    height: 6px;
    border-radius: 1.5px;
    background: var(--brand);
    transform: rotate(45deg);
  }

  /* ---------- primary actions ---------- */
  .cta {
    display: flex;
    gap: 8px;
    margin-top: 32px;
  }
  .save, .share {
    height: 52px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 160ms var(--ease-out), filter 160ms ease, background-color 160ms ease;
  }
  .save {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--brand-strong);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .16),
      inset 0 -1px 0 rgba(0, 0, 0, .08),
      0 1px 2px rgba(0, 0, 0, .08),
      0 10px 24px -10px rgba(var(--brand-rgb), .7);
  }
  .share {
    width: 52px;
    flex: none;
    background: var(--surface);
    color: var(--text-2);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(17, 17, 16, .04);
  }
  .save:active, .share:active { transform: scale(0.97); }

  /* label swap on tap: old label leaves up, new one arrives from below */
  .save .label {
    display: flex;
    align-items: center;
    gap: 9px;
    transition: transform 360ms var(--ease-out), opacity 200ms ease, filter 200ms ease;
  }
  .save .label + .label { position: absolute; inset: 0; justify-content: center; transform: translateY(18px); opacity: 0; filter: blur(3px); }
  .save.done .label:first-child { transform: translateY(-18px); opacity: 0; filter: blur(3px); }
  .save.done .label + .label { transform: none; opacity: 1; filter: none; }

  /* ---------- details ---------- */
  .list {
    margin-top: 28px;
    border-radius: 20px;
    background: var(--surface);
    box-shadow:
      0 0 0 1px var(--line),
      0 1px 2px rgba(17, 17, 16, .03),
      0 16px 36px -18px rgba(17, 17, 16, .10);
    overflow: hidden;
  }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    transition: background-color 120ms ease;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 64px;
    right: 0;
    height: 1px;
    background: var(--line);
  }
  .row:has(.link:active) { background: var(--press); }
  .link {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 66px;
    padding: 12px 0 12px 16px;
  }
  .glyph {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(var(--brand-rgb), .085);
    color: var(--brand);
  }
  .meta { min-width: 0; text-align: left; }
  .meta small {
    display: block;
    font-size: 12.5px;
    line-height: 1.3;
    color: var(--text-3);
  }
  .meta span {
    display: block;
    margin-top: 1px;
    font-size: 15.5px;
    font-weight: 500;
    letter-spacing: -0.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .trail {
    width: 48px;
    height: 48px;
    margin-right: 6px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: var(--text-3);
    transition: transform 160ms var(--ease-out), color 160ms ease, background-color 160ms ease;
  }
  button.trail:active { transform: scale(0.9); }

  /* copy ⇄ check, cross-faded with a little blur */
  .swap { position: relative; width: 17px; height: 17px; }
  .swap svg {
    position: absolute;
    inset: 0;
    transition: opacity 180ms ease, transform 300ms var(--ease-out), filter 180ms ease;
  }
  .swap svg + svg { opacity: 0; transform: scale(0.4); filter: blur(3px); color: var(--brand); }
  .done .swap svg:first-child { opacity: 0; transform: scale(0.4); filter: blur(3px); }
  .done .swap svg + svg { opacity: 1; transform: none; filter: none; }

  @media (hover: hover) and (pointer: fine) {
    .save:hover { filter: brightness(1.07); }
    .share:hover { color: var(--text); }
    .row:has(.link:hover) { background: color-mix(in srgb, var(--press) 60%, transparent); }
    .trail:hover { color: var(--text); background: var(--press); }
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px 10px 12px;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap; /* left:50% halves the shrink-to-fit width; keep the message on one line */
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .3);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 10px) scale(0.96);
    transition: opacity 200ms ease, transform 340ms var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  /* Android: Chrome's own download bar takes the bottom of the screen, so speak from the top */
  .toast.top { top: max(16px, env(safe-area-inset-top)); bottom: auto; transform: translate(-50%, -10px) scale(0.96); max-width: calc(100vw - 32px); }
  .toast.top.show { transform: translate(-50%, 0) scale(1); }

  /* ---------- entrance ---------- */
  .in {
    animation: rise 700ms var(--ease-out) both;
    animation-delay: calc(var(--i, 0) * 50ms + 40ms);
  }
  .logo.in { animation-name: settle; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); filter: blur(4px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes settle {
    from { opacity: 0; transform: scale(0.9); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .in, .logo.in { animation: fade 200ms ease both; }
    .save .label, .swap svg, .toast { transition-property: opacity; }
    .toast { transform: translate(-50%, 0); }
  }

  /* ---------- larger screens: present as a card ---------- */
  @media (min-width: 640px) {
    body { display: grid; place-items: center; padding: 48px 16px; }
    .page {
      padding: 48px 32px 32px;
      border-radius: 32px;
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(17,17,16,.04), 0 40px 90px -30px rgba(17, 17, 16, .25);
    }
  }
</style>
</head>
<body>
<main class="page">
  <section class="identity">
    <div class="logo in" style="--i:0">
      <img id="logo" src="assets/logo-sa.png" width="88" height="88" alt="Yüksel Saudia logo">
    </div>
    <h1 class="in" style="--i:1">Murat Bugday</h1>
    <p class="company in" style="--i:2"><i aria-hidden="true"></i><span data-company>Yüksel Saudia</span></p>
  </section>

  <div class="cta in" style="--i:3">
    <a class="save" id="save" href="murat-bugday-sa.vcf">
      <span class="label">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
        Save contact
      </span>
      <span class="label" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span id="save-done">Opening contact</span>
      </span>
    </a>
    <button class="share" type="button" id="share" aria-label="Share this card">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
    </button>
  </div>

  <div class="list in" style="--i:4">
    <div class="row">
      <a class="link" href="tel:+966112931000">
        <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span class="meta"><small>Work phone</small><span>+966 11 293 1000</span></span>
      </a>
      <button class="trail" type="button" data-copy="+966112931000" data-what="Number" aria-label="Copy phone number">
        <span class="swap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </button>
    </div>
    <div class="row">
      <a class="link" href="mailto:mbugday@yuksel.net">
        <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
        <span class="meta"><small>Email</small><span>mbugday@yuksel.net</span></span>
      </a>
      <button class="trail" type="button" data-copy="mbugday@yuksel.net" data-what="Email" aria-label="Copy email address">
        <span class="swap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </button>
    </div>
    <div class="row">
      <a class="link" href="https://www.yukselsaudia.com" target="_blank" rel="noopener">
        <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span>
        <span class="meta"><small>Website</small><span>yukselsaudia.com</span></span>
      </a>
      <span class="trail" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </span>
    </div>
    <div class="row">
      <div class="link">
        <span class="glyph"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg></span>
        <span class="meta"><small>Company</small><span data-company>Yüksel Saudia</span></span>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toast-text">Copied</span>
</div>

<script>
  (function () {
    var BRANDS = {
      sa:  { company: "Yüksel Saudia" },
      ltd: { company: "Yüksel Limited" }
    };
    var key = document.documentElement.dataset.brand;
    var b = BRANDS[key];

    document.querySelectorAll("[data-company]").forEach(function (el) { el.textContent = b.company; });
    var logo = document.getElementById("logo");
    logo.src = "assets/logo-" + key + ".png";
    logo.alt = b.company + " logo";
    document.getElementById("icon").href = "assets/favicon-" + key + ".png";
    document.getElementById("touch-icon").href = "assets/apple-touch-" + key + ".png";
    document.title = "Murat Bugday · " + b.company;

    // iPhone opens a .vcf straight into Contacts. Android browsers are not allowed to:
    // they always download it first, so give the file a clean name and point at "Open".
    var isAndroid = /Android/i.test(navigator.userAgent);
    var save = document.getElementById("save");
    save.href = "murat-bugday-" + key + ".vcf";
    if (isAndroid) {
      save.setAttribute("download", "Murat Bugday.vcf");
      document.getElementById("save-done").textContent = "Contact downloaded";
    }
    var saveTimer;
    save.addEventListener("click", function () {
      save.classList.add("done");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { save.classList.remove("done"); }, isAndroid ? 4000 : 2200);
      if (isAndroid) setTimeout(function () { notify("Now tap “Open” at the bottom", 6000, true); }, 350);
    });

    var toast = document.getElementById("toast");
    var toastText = document.getElementById("toast-text");
    var toastTimer;
    function notify(msg, ms, top) {
      toastText.textContent = msg;
      toast.classList.toggle("top", !!top);
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 1800);
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (resolve, reject) {
        var t = document.createElement("textarea");
        t.value = text;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
        document.body.removeChild(t);
      });
    }

    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      var timer;
      btn.addEventListener("click", function () {
        copyText(btn.dataset.copy).then(function () {
          btn.classList.add("done");
          notify(btn.dataset.what + " copied");
          clearTimeout(timer);
          timer = setTimeout(function () { btn.classList.remove("done"); }, 1600);
        }, function () { notify("Couldn’t copy"); });
      });
    });

    document.getElementById("share").addEventListener("click", function () {
      var data = { title: "Murat Bugday", text: "Murat Bugday · " + b.company, url: location.href };
      if (navigator.share) {
        navigator.share(data).catch(function () {});
      } else {
        copyText(location.href).then(function () { notify("Link copied"); });
      }
    });
  })();
</script>
</body>
</html>
